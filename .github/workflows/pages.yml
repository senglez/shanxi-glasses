# Builds the static site from content/*.json and deploys it to GitHub Pages
# on every push to main. Custom domain: set repository variables
#   SITE_URL = https://www.your-domain.com   CNAME = www.your-domain.com
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.changed.outputs.urls }}
      site_url: ${{ steps.changed.outputs.site_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve site URL
        env:
          CUSTOM_URL: ${{ vars.SITE_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_URL" ]; then
            echo "SITE_URL=${CUSTOM_URL%/}" >> "$GITHUB_ENV"
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
            echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          fi
      - name: Build static site
        run: npm run build:static
        env:
          CNAME: ${{ vars.CNAME }}
      - name: Find changed pages for IndexNow
        id: changed
        run: node scripts/indexnow.js changed
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Notify Bing and other IndexNow search engines about changed pages. Never blocks the deploy.
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/indexnow.js submit
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
          URLS: ${{ needs.build.outputs.urls }}
